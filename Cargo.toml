[package]
name = "jrg"
version = "0.15.3"
edition = "2024"
rust-version = "1.88"
description = "A Japanese-friendly recursive text search CLI"
license = "MIT"
repository = "https://github.com/miyajima/jrg"

[dependencies]
ast-grep-language = { version = "=0.45.1", default-features = false, features = ["tree-sitter-rust", "tree-sitter-python", "tree-sitter-typescript", "tree-sitter-javascript"] }
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
ignore = "0.4"
regex = "1.11"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1.0"
sha2 = "=0.10.9"
tiktoken-rs = "0.7"
unicode-normalization = "0.1"
unicode-segmentation = "=1.12.0"
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = true
