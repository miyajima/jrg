[package]
name = "jrg"
version = "0.8.0"
edition = "2024"
rust-version = "1.88"
description = "A Japanese-friendly recursive text search CLI"
license = "MIT"
repository = "https://github.com/miyajima/jrg"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
ignore = "0.4"
regex = "1.11"
serde_json = "1.0"
tiktoken-rs = "0.7"
unicode-normalization = "0.1"
unicode-segmentation = "=1.12.0"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = true
